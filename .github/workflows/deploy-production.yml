name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: Production
  cancel-in-progress: false

jobs:
  test:
    name: Django Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django checks
        run: python eyelearn/manage.py check

      - name: Run tests
        run: python eyelearn/manage.py test api.tests

  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: Production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate Vercel token
        run: |
          echo "VERCEL_TOKEN length: ${#VERCEL_TOKEN}"
          printf '%s' "$VERCEL_TOKEN" | sha256sum | awk '{print "VERCEL_TOKEN sha256: " $1}'

          response_file="$(mktemp)"
          status_code="$(curl --silent --show-error --write-out "%{http_code}" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$response_file" \
            https://api.vercel.com/v2/user)"

          if [ "$status_code" -lt 200 ] || [ "$status_code" -ge 300 ]; then
            echo "Vercel token validation failed with HTTP $status_code"
            cat "$response_file"
            exit 1
          fi

          echo "Vercel token validation succeeded with HTTP $status_code"
          cat "$response_file"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
